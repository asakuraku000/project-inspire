<style>
:root{--bg:#F5F8FE;--surface:#FFFFFF;--ink:#0D1A4A;--muted:#47557F;--primary:#12338F;--on-primary:#FFFFFF;--accent:#12338F;--gold:#F3B62B;--on-gold:#2A1E00;--gold-soft:#FFF4D6;--blue-soft:#E6EFFF;--line:#CBD6F0;--focus:#12338F;--star-off:#D3DBF1;--shadow:rgba(18,51,143,.28);--good:#13663F;--good-soft:#D9F2E4;--bad:#A12A18;--bad-soft:#FBE2DC;--font-display:'Bricolage Grotesque','Lexend',system-ui,sans-serif;--font-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1230;--surface:#131F4A;--ink:#EAF0FF;--muted:#A5B4E3;--primary:#3F65DB;--accent:#A9C0FF;--gold-soft:#33290C;--blue-soft:#15245A;--line:#2B3D7C;--focus:#F3B62B;--star-off:#2B3D7C;--shadow:rgba(0,0,0,.5);--good:#7BE0A9;--good-soft:#12382A;--bad:#FFA392;--bad-soft:#40201B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1230;--surface:#131F4A;--ink:#EAF0FF;--muted:#A5B4E3;--primary:#3F65DB;--accent:#A9C0FF;--gold-soft:#33290C;--blue-soft:#15245A;--line:#2B3D7C;--focus:#F3B62B;--star-off:#2B3D7C;--shadow:rgba(0,0,0,.5);--good:#7BE0A9;--good-soft:#12382A;--bad:#FFA392;--bad-soft:#40201B;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance;color:var(--accent)}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800;letter-spacing:-.01em}h2{font-size:1.45rem;font-weight:800}h3{font-size:1.15rem;font-weight:600}p{margin:0}
.shell{max-width:46rem;margin:0 auto;padding-block:20px 48px;display:grid;gap:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:grid;gap:14px}.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.pill{background:var(--primary);color:var(--on-primary);font-weight:600;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;padding:.6rem .95rem;border-radius:8px;box-shadow:0 4px 10px -6px var(--shadow)}
.tools{display:flex;align-items:center;gap:10px}.rule{height:4px;border-radius:2px;background:var(--gold)}.sub{color:var(--muted);max-width:38rem}
.foot{color:var(--muted);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;padding-top:6px}
.toggle{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:500}
.toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.total{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font-weight:600;text-align:left;justify-self:start}
.btn{min-height:50px;padding:0 22px;border-radius:10px;border:2px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:600}
.btn.gold{background:var(--gold);color:var(--on-gold)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.small{min-height:42px;padding:0 14px;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:10px}.cards{display:grid;gap:18px}
.card{background:var(--blue-soft);border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:0 10px 24px -16px var(--shadow)}.card.cream{background:var(--gold-soft)}
.card .kicker{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}.card li{display:flex;gap:10px;align-items:center;justify-content:space-between}.card li span:first-child{min-width:0}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;min-height:72px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left}
.row .n{width:38px;height:38px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:600}
.row strong{display:block;font-weight:600}.row small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35}
.row:disabled{opacity:.6;cursor:not-allowed;transform:none!important}.row:disabled .n{background:var(--line);color:var(--muted)}
.wq{display:grid;gap:12px;justify-items:center;width:100%}.wq .hint{width:100%;max-width:30rem}
.wq-row{display:flex;gap:6px;justify-content:center}
.wq-c{width:min(14vw,54px);aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:1.4rem;text-transform:uppercase;background:var(--surface);color:var(--ink)}
.wq-c.f{border-color:var(--primary)}
.wq-c.c,.wq-k.c{background:#2E7D32;border-color:#2E7D32;color:#fff}.wq-c.p,.wq-k.p{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}.wq-c.a,.wq-k.a{background:var(--line);border-color:var(--line);color:var(--muted)}
.wq-k{min-width:30px;min-height:46px;padding:0 9px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem}.wq-k:disabled{opacity:.4}
.wq-kb{display:grid;gap:6px;width:100%;max-width:30rem}.wq-kb .wq-row{gap:4px}.wq-kb .wq-k{flex:1;min-width:0;padding:0 2px}
.meta{display:grid;justify-items:end;gap:4px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.stars{display:inline-flex;flex-wrap:wrap;gap:2px}.star{display:inline-flex;width:20px;height:20px;color:var(--star-off)}.star.on{color:var(--gold)}.star svg{width:100%;height:100%;fill:currentColor}.big .star{width:34px;height:34px}
.stage{display:grid;gap:16px}.intro{color:var(--muted)}
.tip{display:none;white-space:pre-line;background:var(--gold-soft);border-left:5px solid var(--gold);border-radius:6px 12px 12px 6px;padding:12px 16px;font-size:.9rem}body.fac .tip{display:block}
.tip b{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.prompt{font-size:1.15rem;font-weight:500}.count{font-size:.85rem;color:var(--muted);font-weight:500}
.toolrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hint{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:.92rem}
.feedback{border-radius:10px;padding:10px 14px;font-size:.95rem}.feedback:empty{display:none}
.feedback.good{background:var(--good-soft);color:var(--good)}.feedback.bad{background:var(--bad-soft);color:var(--bad)}.feedback.info{background:var(--blue-soft);color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:54px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-align:left;line-height:1.35}
.opt:disabled{cursor:default}.opt:disabled:not(.good):not(.bad){opacity:.55}
.opt.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt.bad,.tile.bad{animation:shake .28s}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.col{display:grid;gap:10px;align-content:start}
.tile{display:grid;gap:6px;align-content:center;min-height:62px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font-size:.92rem;line-height:1.35;overflow-wrap:anywhere}
.tile.term{font-weight:600;font-size:1.02rem;color:var(--accent)}.tile.sel{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.tile.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}.tile.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tile:disabled{cursor:default}.tile .tl{font-size:.8rem;font-weight:400;color:var(--muted)}.tile.good .tl{color:inherit}
.seq{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:8px}
.seq li{counter-increment:s;display:flex;gap:12px;align-items:center;min-height:50px;padding:8px 12px;border-radius:12px;border:2px dashed var(--line);color:var(--muted)}
.seq li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.seq li.filled{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}.seq li.filled::before{background:var(--good);color:var(--good-soft)}
.pool{display:grid;gap:10px}
.player{display:grid;gap:12px;background:var(--blue-soft);border-radius:16px;padding:16px}.story{background:var(--surface);border-radius:12px;padding:14px;font-size:1rem}
.field{display:grid;gap:6px}.field label{font-weight:600;font-size:.9rem}
.field input,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.field textarea{min-height:9.5rem;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:.9rem;font-weight:500}.chip.word{border-color:var(--gold)}
.label-s{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}.checks li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.checks li::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;line-height:1}
.checks li.ok{color:var(--ink)}.checks li.ok::before{content:"\2713";background:var(--good);border-color:var(--good);color:var(--surface)}
.out{background:var(--primary);color:var(--on-primary);border-radius:18px;padding:22px;display:grid;gap:12px;user-select:text;-webkit-user-select:text}
.out .who{font-family:var(--font-display);font-weight:800;font-size:1.35rem}.out hr{border:0;height:4px;width:64px;border-radius:2px;background:var(--gold);margin:0}
.out p{white-space:pre-wrap;overflow-wrap:anywhere}.out .tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.done{display:grid;gap:14px;justify-items:start;background:var(--blue-soft);border-radius:18px;padding:24px}
.card.break{background:var(--surface);border:2px dashed var(--line);box-shadow:none}
.gm-ov{position:fixed;inset:0;z-index:200;background:rgba(5,12,40,.72);display:grid;place-items:center}
.gm-box{background:var(--surface);color:var(--ink);width:100%;max-width:60rem;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
@media(min-width:760px){.gm-ov{padding:20px}.gm-box{height:min(92vh,900px);border-radius:18px}}
.gm-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:2px solid var(--line)}.gm-top h2{margin:0;font-size:1.05rem}.gm-act{display:flex;gap:8px;flex-wrap:wrap}
.gm-body{overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.gm-play{padding:0;gap:0;grid-template-rows:auto minmax(0,1fr);overflow:hidden;align-content:stretch}.gm-play .hint{border-radius:0;font-size:.82rem;padding:6px 12px}
.gm-frame{width:100%;height:100%;border:0;background:var(--surface)}
a.btn{display:inline-grid;place-items:center;text-decoration:none;text-align:center}.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.card.mat h2{font-size:1.1rem}
</style>

<div id="app" class="shell"></div>

<script>
(function(){
'use strict';
/* EDIT HERE: all the words in the games. For multiple-choice, "answer" must be EXACTLY one of the "options".
   For the Listen game, put your own audio file name in audioUrl (example "story.mp3"); if empty, the phone reads aloud. */
var STORY=["Luca is 19 years old.","He stopped school when his family had money problems.","One rainy day, he saw a poster at the barangay hall.","The poster said, “You still have options.”","Luca was nervous, but he saved the phone number.","After some time, he made the call and asked, “Can I still study?”","The answer was, “Of course.”","Now Luca joins learning sessions.","He is no longer afraid to ask questions."];
var CONTENT={
brand:"Project INSPIRE · Language for Life",
home:{title:"Hub Games",text:"Play in pairs. One person reads, the other taps. Mistakes are okay. Try again until you get it."},
healthBreak:{title:"Health Break",text:"Stretch, drink water, and rest. See you in Session 2!"},
sessions:[
{label:"Session 1",time:"8:30–10:00 AM",title:"Online Learning Hub Orientation",
blurb:"“Language Learning Beyond the Classroom.” Get to know hub access, navigation, search, and the learning materials. Practice reading interface text, following digital directions, and choosing accurate search words.",
tip:"Use these games between your live hub demo. Show the real hub screen first, then let them play.\nSAY: “You already know more digital English than you think.”",
activities:[
{type:"match",title:"Hub Words",minutes:8,blurb:"Match each word from the hub and other apps to its meaning.",intro:"Tap a word on the left. Then tap its meaning on the right.",
tip:"ASK: “Which of these words have you already seen on your phone?” [PAUSE for 2–3 answers]\nSAY: “These words are on almost every website and app.”\nTRANSITION: “Now let us use them.”",
pairs:[
{term:"Log in",meaning:"Enter your account with your username and password.",tl:"Pumasok sa account mo gamit ang username at password."},
{term:"Search",meaning:"Look for a lesson, a file, or a word.",tl:"Maghanap ng aralin, file, o salita."},
{term:"Menu",meaning:"A list of choices on the screen.",tl:"Listahan ng mga pagpipilian sa screen."},
{term:"Download",meaning:"Save a file on your phone.",tl:"I-save ang file sa phone mo."},
{term:"Submit",meaning:"Send your answer or your work.",tl:"Ipadala ang sagot o gawa mo."},
{term:"Back",meaning:"Go to the page before.",tl:"Bumalik sa nakaraang pahina."}]},
{type:"match",title:"Hub Materials",minutes:6,blurb:"Match each kind of lesson to what you can do with it.",intro:"Tap a lesson type on the left. Then tap what you can do with it on the right.",
pairs:[
{term:"Reading lessons",meaning:"Read short stories and texts.",tl:"Magbasa ng maikling kuwento at teksto."},
{term:"Listening lessons",meaning:"Listen to audio and answer questions.",tl:"Makinig sa audio at sagutin ang mga tanong."},
{term:"Vocabulary lists",meaning:"Learn new words for work and daily life.",tl:"Matuto ng bagong salita para sa trabaho at araw-araw."},
{term:"Writing guides",meaning:"Learn to write letters and short messages.",tl:"Matutong sumulat ng liham at maikling mensahe."},
{term:"Grammar lessons",meaning:"Learn how to build correct sentences.",tl:"Matutong bumuo ng tamang pangungusap."},
{term:"Worksheets",meaning:"Download and practice on your phone.",tl:"I-download at magsanay sa phone mo."}]},
{type:"choice",title:"What Should I Tap?",minutes:10,blurb:"Read the situation. Choose the right button or message.",intro:"Read each situation. Choose the best answer.",
tip:"SAY: “Some screens are from other websites and apps, not only our hub.” (Our hub has no log in.)\nLet pairs discuss for 10 seconds before they tap. Ask one pair to explain why an answer is right.",
questions:[
{prompt:"You want to find a lesson about job interviews. Which button do you use?",options:["Search","Log out","Submit","Download"],answer:"Search",why:"Search helps you look for lessons and files.",hint:"Naghahanap ka ng aralin. Anong button ang pang-hanap?"},
{prompt:"You finished your answers. Which button sends them?",options:["Back","Submit","Menu","Search"],answer:"Submit",why:"Submit means send.",hint:"Tapos mo na ang sagot. Alin ang magpapadala nito?"},
{prompt:"You opened the wrong lesson by mistake. What do you tap to return?",options:["Back","Download","Submit","Log in"],answer:"Back",why:"Back takes you to the page before.",hint:"Gusto mong bumalik sa nakaraang pahina."},
{prompt:"You want to keep a worksheet on your phone for later. What do you tap?",options:["Download","Search","Back","Help"],answer:"Download",why:"Download saves the file on your phone.",hint:"Gusto mong i-save ang file sa phone mo."},
{prompt:"The screen says: “Incorrect password. Please try again.” What should you do?",options:["Type your password again carefully.","Ignore the message and wait.","Tap Download.","Log out of your phone."],answer:"Type your password again carefully.",why:"“Incorrect” means not correct. “Try again” means do it one more time.",hint:"Ang “Incorrect” ay mali. Ang “try again” ay subukan muli."},
{prompt:"The screen says: “Your file is uploading. Please wait.” What is happening?",options:["The hub is receiving your file.","Your file was deleted.","Your password is wrong.","The lesson is finished."],answer:"The hub is receiving your file.",why:"Upload means sending a file from your phone to the hub.",hint:"Ang “upload” ay pagpapadala ng file mula sa phone papunta sa hub."}]},
{type:"order",title:"Follow the Directions",minutes:8,blurb:"Put the steps in the right order.",intro:"Tap the step that comes first. Then the next one. Keep going until the list is complete.",
tip:"SAY: “Digital directions are short commands. Read the first word of each step.”\nPoint out the action words: open, tap, type, choose, check.",
rounds:[
{title:"Open a lesson on the hub",hint:"Pindutin ang unang hakbang, tapos ang susunod.",steps:["Open the Online Learning Hub.","Tap the Search bar.","Type a keyword and tap Search.","Choose a lesson from the results.","Tap Open to start the lesson."]},
{title:"Send your answer",hint:"Ano ang una mong gagawin bago mag-type?",steps:["Read the question carefully.","Type your answer in the box.","Check your spelling.","Tap Submit.","Wait for the message: Answer received."]}]},
{type:"choice",title:"Pick the Best Search Words",minutes:10,blurb:"Choose the words that will find the right lesson.",intro:"Good search words are specific. Use two to four words. Check your spelling.",
tip:"ASK: “Why is one word not enough?”\nSAY: “Too short gives too many results. Too long gives none.”\nAfter the game, let them search one real topic on the hub.",
questions:[
{prompt:"You want a short story to practice reading. Which search words are best?",options:["story","short story reading practice","I want something to read please thank you","read"],answer:"short story reading practice",why:"Two to four specific words work best. “story” is too wide. A full sentence is too long.",hint:"Piliin ang tiyak na salita. Hindi masyadong maikli, hindi masyadong mahaba."},
{prompt:"You need help writing a job application letter. Which search words are best?",options:["letter","help","job application letter","I need help with writing"],answer:"job application letter",why:"These words name exactly what you need.",hint:"Anong eksaktong aralin ang kailangan mo?"},
{prompt:"You want to practice listening in English. Which search words are best?",options:["English","listening","I like English audio things","English listening practice"],answer:"English listening practice",why:"It says the language and the skill and the purpose.",hint:"Isama ang wika at ang kasanayan."},
{prompt:"You want to learn words about work. Which search words are best?",options:["words","I need work","work vocabulary","vocab"],answer:"work vocabulary",why:"“Vocabulary” means words you learn. “Work vocabulary” is clear and short.",hint:"Ang “vocabulary” ay mga salitang pinag-aaralan."},
{prompt:"You want a lesson about grammar. Which spelling will find it?",options:["grammer","gramar","grammar","grammmar"],answer:"grammar",why:"One wrong letter can give you no results. Always check your spelling.",hint:"Tingnan nang mabuti ang bawat letra."}]}
]},
{label:"Session 2",time:"10:15–11:00 AM",title:"Guided Digital Language Learning Lab",
blurb:"“Read, Listen, Respond.” Using one hub resource: learn words in context, read and listen, then write a short response.",
tip:"The story is a short version of “The Road Is Still Open.” To use another hub resource, edit STORY and also the questions, vocabulary, listening questions and word bank in Session 2.\nOrder: read the story, words, listen, write.",
activities:[
{type:"find",title:"Find the Sentence",minutes:8,blurb:"Read the story. Tap the sentence that answers each question.",intro:"Read the story first. Then tap the sentence that answers the question.",
tip:"SAY: “Good readers look for proof in the text.”\nAsk: “Which word in the sentence told you?”",passage:STORY,
rounds:[
{prompt:"Tap the sentence that shows why Luca stopped school.",answer:STORY[1],hint:"Hanapin ang dahilan kung bakit huminto si Luca."},
{prompt:"Tap the sentence that shows Luca was nervous.",answer:STORY[4],hint:"Hanapin ang salitang nagpapakita ng kaba."},
{prompt:"Tap the sentence that proves Luca is changing.",answer:STORY[8],hint:"Ano ang hindi na ginagawa ni Luca dahil sa takot?"}]},
{type:"choice",title:"Word in Context",minutes:8,blurb:"Choose the word that fits the sentence.",
intro:"Remember the story of Luca? Read the sentence. Choose the word that fits. Tap \u201CShow the story\u201D if you need it.",storyRef:STORY,
tip:"Before each question, ask: “What clue in the sentence helps you?”\nPraise the clue, not only the answer.",
questions:[
{prompt:"Luca felt ____ before he made the phone call. His heart was beating fast.",options:["nervous","sleepy","proud"],answer:"nervous",why:"Nervous means worried or afraid before something important.",hint:"nervous = kinakabahan"},
{prompt:"The person on the phone explained the ____: Monday to Friday, 8:00 AM.",options:["schedule","weather","mirror"],answer:"schedule",why:"A schedule tells you the days and the times.",hint:"schedule = iskedyul"},
{prompt:"To join the program, you must bring a valid ID. This is a ____.",options:["requirement","rainstorm","birthday"],answer:"requirement",why:"A requirement is something you must have or must do.",hint:"requirement = kailangang dalhin o gawin"},
{prompt:"Joining a learning program is a good ____ for Luca. It is a chance to start again.",options:["opportunity","opinion","opposite"],answer:"opportunity",why:"An opportunity is a chance to do something good.",hint:"opportunity = pagkakataon"},
{prompt:"After many sessions, Luca felt more ____ when he spoke in class.",options:["confident","confused","absent"],answer:"confident",why:"Confident means you believe you can do it.",hint:"confident = may tiwala sa sarili"}]},
{type:"choice",title:"Listen and Answer",minutes:8,blurb:"Listen to the story. Answer without reading.",intro:"Tap Play and listen. You can play it again. Then answer the questions.",
tip:"Play it twice. First time: just listen. Second time: listen for the answers.\nIf the phone cannot read aloud, play your own recording or read it yourself.",

<script>
(function(){

/* ---------- CSS ---------- */

/* ---------- sound ---------- */
function unlock(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume();
  return ac;
}
function tone(f,t,d,type,v,f2){
  if(!on) return; var a=unlock(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain(), s=a.currentTime+t;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,s);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,s+d);

    p.style.cssText='position:fixed;left:'+(rain?Math.random()*innerWidth:x)+'px;top:'+(rain?-14:y)+'px;width:'+sz+'px;height:'+(sz*(Math.random()<.5?1:.5))+'px;background:'+cols[i%cols.length]+';border-radius:'+(Math.random()<.4?'50%':'2px')+';pointer-events:none;z-index:99';
    document.body.appendChild(p);
    var dx=(Math.random()-.5)*(rain?160:260), dy=rain?innerHeight+40:-(60+Math.random()*140), rot=Math.random()*900;
    var frames=rain

  combo++;
  var f=523*Math.pow(1.0595,Math.min(combo,8)*2);
  tone(f,0,.12,'triangle',.18); tone(f*1.5,.09,.22,'triangle',.18);
  burst(px,py,combo>=3?28:14); vib(25);
  say(combo>=3 ? combo+' sunod-sunod! 🔥' : pick(['Galing! 🎉','Tama! 💪','Ayos! ⭐','Sulit! 👏','Boom! 💥']));
}
function bad(){
  combo=0;
  tone(230,0,.3,'sawtooth',.09,110); vib([40,40,40]);
  say(pick(['Konti na lang! 💪','Subukan ulit! 😄','Kaya mo yan! 🙌']));
}
function win(){
  var all=document.querySelectorAll('.done .star'), got=document.querySelectorAll('.done .star.on').length;
  all.forEach(function(s,i){ s.style.animationDelay=(i*.14)+'s'; });
  [523,659,784,1047].forEach(function(f,i){ tone(f,i*.11,.25,'triangle',.18); });
  for(var i=0;i<got;i++) tone(880+i*110,.5+i*.14,.2,'sine',.14);
  if(all.length && got===all.length) tone(1568,.6+got*.14,.5,'triangle',.16);
  burst(0,0,got?70:20,true); vib([60,40,100]);
  say(all.length && got===all.length ? 'PERFECT! 🏆' : got ? 'Galing mo! 🎉' : 'Ulit pa tayo! 💪');
}

/* ---------- detect right / wrong without touching the game code ---------- */
function marks(){
  return { s:document.querySelectorAll('.opt.good,.tile.good,.seq li.filled').length,
           b:document.querySelectorAll('.opt.bad,.tile.bad').length };
}
document.addEventListener('pointerdown',function(e){
  px=e.clientX; py=e.clientY;
  var b=e.target.closest && e.target.closest('button');
  if(b && !b.disabled){ unlock(); tone(440,0,.05,'sine',.07,660); }
},true);
document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('button');
  snap = (b && b.closest('#app') && b.matches('.opt,.tile')) ? { m:marks(), pool:!!b.closest('.pool') } : null;
},true);
document.addEventListener('click',function(){
  if(!snap) return;
  var a=marks(), s=snap; snap=null;
  if(a.s>s.m.s) good();
  else if(a.b>s.m.b) bad();
  else if(s.pool){ var f=document.querySelector('.feedback.bad'); if(f && f.textContent) bad(); }
});

/* ---------- sound button + finish celebration ---------- */
function sndBtn(){
  var b=document.createElement('button'); b.type='button'; b.className='toggle fxsnd';
  function up(){ b.textContent=on?'🔊 Sound':'🔇 Sound'; b.setAttribute('aria-pressed',on?'true':'false'); }
  b.addEventListener('click',function(){
    on=!on; try{ localStorage.setItem('inspireSound',on?'on':'off'); }catch(e){}
    up(); if(on){ tone(660,0,.1,'triangle',.15); tone(990,.08,.18,'triangle',.15); }
  });
  up(); return b;
}
function ensureBtn(){
  document.querySelectorAll('.tools').forEach(function(t){ if(!t.querySelector('.fxsnd')) t.prepend(sndBtn()); });
}
new MutationObserver(function(ms){
  ensureBtn();
  for(var i=0;i<ms.length;i++){
    var n=ms[i].addedNodes;
    for(var j=0;j<n.length;j++){
      var x=n[j];
      if(x.nodeType===1 && (x.classList.contains('done') || x.querySelector('.done'))){ win(); return; }
    }
  }
}).observe(app,{childList:true,subtree:true});
ensureBtn();
})();
</script>
</html>
